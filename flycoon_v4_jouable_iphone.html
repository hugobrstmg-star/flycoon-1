<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FLYCOON V4</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}#app{height:100%;width:100%;position:relative;overflow:hidden}.head{height:70px;padding:15px 18px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:28px;font-weight:950;letter-spacing:2px}.wallet{color:#ffd166;font-weight:900}.home{text-align:center;padding:28px 15px}
.coon{width:106px;height:106px;border-radius:53px;margin:10px auto 18px;display:flex;align-items:center;justify-content:center;animation:bob 1.5s ease-in-out infinite;box-shadow:0 18px 40px #0006}
@keyframes bob{50%{transform:translateY(-9px)}}.mask{width:75px;height:34px;border-radius:18px;background:#eee;color:#111;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:7px}
button{border:0;border-radius:15px;padding:14px 25px;margin:6px;background:#ff9f1c;color:#fff;font-weight:950;cursor:pointer}button.alt{background:transparent;border:1px solid #34465d}
.bar{width:240px;height:8px;background:#29394e;border-radius:6px;margin:8px auto;overflow:hidden}.fill{height:100%;background:#ff9f1c}.muted,.best{color:#8193aa}.best{font-weight:800}.row{display:flex;justify-content:center;flex-wrap:wrap}
.page{height:calc(100% - 70px);overflow:auto;padding:15px}.page h1{font-size:29px}.card,.mission,.rank{background:#121f31;border-radius:17px;padding:12px;margin:9px 0;display:flex;gap:12px;align-items:center}.mission{display:block}.avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center}.main{flex:1}.rarity{font-size:10px;color:#ffb23c;font-weight:900}.price{color:#9fb0c4;font-size:13px;font-weight:800}.back{text-align:center;color:#ffb23c;font-weight:900;padding:18px}
.game{position:absolute;inset:0;background:linear-gradient(#4fc3dc,#a9edf2);overflow:hidden;touch-action:none}.score{position:absolute;top:18px;left:0;right:0;text-align:center;font-size:55px;font-weight:950;z-index:9;text-shadow:0 3px 4px #357}.run{position:absolute;top:82px;left:0;right:0;text-align:center;font-weight:900;z-index:9}
.pipe{position:absolute;width:64px;background:#45b83e;border:3px solid #267c2a;border-radius:6px}.coin{position:absolute;font-size:26px;z-index:4;animation:spin .7s linear infinite}@keyframes spin{50%{transform:scale(1.2)}}.player{position:absolute;left:88px;width:46px;height:46px;border-radius:50%;z-index:5;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px #0003}.ground{position:absolute;bottom:0;height:72px;width:100%;background:#d3af5a;border-top:10px solid #69b74b;z-index:6}
.overlay{position:absolute;inset:0;background:#07111fee;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center}.big{font-size:38px;font-weight:950}
.small{font-size:12px;color:#8193aa}
</style>
</head>
<body><div id="app" style="display:flex;align-items:center;justify-content:center;text-align:center;padding:24px"><div><div style="font-size:32px;font-weight:900">FLYCOON</div><p style="color:#9fb0c4">Chargement du jeu…</p></div></div>
<script>
const skins=[
["Nova",0,"#9b6433"],["Pixel",350,"#242936"],["Cyber",650,"#e28b49"],["Rush",1000,"#49b85b"],
["Blaze",1500,"#f07832"],["Shadow",2200,"#242b42"],["Neon",3000,"#6b63e8"],["Ice",3800,"#68c9e8"],
["Jungle",4700,"#3ba86b"],["Royal",5800,"#7c5cc7"],["Cosmo",7000,"#8067d8"],["Gold",8500,"#f5bd32"],
["Ruby",10000,"#d94c55"],["Aqua",12000,"#3dbbd1"],["Storm",14500,"#6688a9"],["Solar",17000,"#e5b43d"],
["Lava",20000,"#df5a32"],["Mint",23000,"#62c7a0"],["Violet",27000,"#a66ee8"],["Chrome",32000,"#bfc9d6"],
["Phantom",38000,"#4c536a"],["Galaxy",45000,"#5d6ee5"],["Legend",55000,"#d6a33b"],["Ultra",70000,"#f04a8b"]];
const DEFAULT_DATA={"coins":0,"best":0,"level":1,"xp":0,"owned":[0],"selected":0,"m":{"score":0,"coins":0,"games":0},"claimed":{}};
let d={...DEFAULT_DATA};
try{
  const saved=window.localStorage ? localStorage.getItem("flycoonV4") : null;
  if(saved) d={...DEFAULT_DATA,...JSON.parse(saved)};
}catch(e){ d={...DEFAULT_DATA}; }
const app=document.getElementById("app");
const save=()=>{ try{ if(window.localStorage) localStorage.setItem("flycoonV4",JSON.stringify(d)); }catch(e){} };
const head=()=>`<div class="head"><b class="logo">FLYCOON</b><b class="wallet">🪙 ${d.coins}</b></div>`;
function home(){app.innerHTML=head()+`<div class="home"><div class="coon" style="background:${skins[d.selected][2]}"><div class="mask">● ●</div></div><div class="muted">FLY • COLLECT • MASTER</div><h3>NIVEAU ${d.level}</h3><div class="bar"><div class="fill" style="width:${Math.min(100,d.xp)}%"></div></div><button onclick="start()">JOUER</button><br><button class="alt" onclick="shop()">🛒 BOUTIQUE • 24 SKINS</button><div class="row"><button class="alt" onclick="missions()">🎯 MISSIONS</button><button class="alt" onclick="ranking()">🏆 CLASSEMENT</button></div><button class="alt" onclick="premium()">💎 PREMIUM</button><p class="best">RECORD : ${d.best}</p><p class="small">Touchez l'écran pour voler</p></div>`}
function shop(){app.innerHTML=head()+`<div class="page"><h1>BOUTIQUE</h1><p class="muted">24 skins à débloquer</p>${skins.map((s,i)=>`<div class="card" onclick="buy(${i})"><div class="avatar" style="background:${s[2]}"><div class="mask">● ●</div></div><div class="main"><b>${s[0]}</b><div class="rarity">SKIN ${i+1}/24</div><div class="price">${d.owned.includes(i)?(d.selected==i?"ÉQUIPÉ":"POSSÉDÉ"):"🪙 "+s[1]}</div></div><b>${d.owned.includes(i)?"✓":"→"}</b></div>`).join("")}<div class="back" onclick="home()">← RETOUR</div></div>`}
function buy(i){const s=skins[i];if(d.owned.includes(i))d.selected=i;else if(d.coins>=s[1]){d.coins-=s[1];d.owned.push(i);d.selected=i}else alert("Pas assez de pièces !");save();shop()}
function missions(){const ms=[["score","🎯 AS DU CIEL","Atteins 25 points",25,250],["coins","🪙 RUÉE VERS L'OR","Ramasse 40 pièces",40,350],["games","🎮 ENCORE UNE !","Termine 5 parties",5,200]];app.innerHTML=head()+`<div class="page"><h1>MISSIONS DU JOUR</h1><p class="muted">${new Date().toLocaleDateString("fr-FR")}</p>${ms.map(m=>{const v=Math.min(d.m[m[0]],m[3]),done=d.claimed[m[0]];return `<div class="mission"><b>${m[1]}</b><p class="muted">${m[2]} — ${v}/${m[3]}</p><div class="bar" style="width:100%"><div class="fill" style="width:${v/m[3]*100}%"></div></div><button onclick="claim('${m[0]}',${m[3]},${m[4]})">${done?"RÉCOMPENSE PRISE":v>=m[3]?"RÉCUPÉRER":"EN COURS"}</button></div>`}).join("")}<div class="back" onclick="home()">← RETOUR</div></div>`}
function claim(k,g,r){if(d.m[k]>=g&&!d.claimed[k]){d.coins+=r;d.claimed[k]=1;save()}missions()}
function ranking(){app.innerHTML=head()+`<div class="page"><h1>🏆 CLASSEMENT</h1><p class="muted">Classement de démonstration</p>${[["Toi",d.best],["NovaPilot",312],["PixelKing",248],["RaccoonX",205],["SkyMaster",181]].map((x,i)=>`<div class="rank"><b>#${i+1}</b><span>${x[0]}</span><b style="margin-left:auto">${x[1]}</b></div>`).join("")}<div class="back" onclick="home()">← RETOUR</div></div>`}
function premium(){app.innerHTML=head()+`<div class="page"><h1>💎 PREMIUM</h1><div class="mission"><b>🎬 PUBLICITÉ RÉCOMPENSÉE</b><p class="muted">Prototype : +100 pièces</p><button onclick="d.coins+=100;save();premium()">REGARDER</button></div><div class="mission"><b>💎 PACK 1 000 PIÈCES</b><p class="muted">Achat intégré à connecter</p><button onclick="alert('Prototype : achat intégré à connecter')">ACHETER</button></div><div class="back" onclick="home()">← RETOUR</div></div>`}
let playing=false,y=0,vy=0,score=0,rc=0,pipes=[],coins=[],last=0,spawn=0,passed=0;
function start(){playing=true;y=innerHeight*.42;vy=0;score=0;rc=0;pipes=[];coins=[];passed=0;last=performance.now();render();requestAnimationFrame(loop)}
function flap(){if(playing)vy=-400}
function loop(t){if(!playing)return;const dt=Math.min((t-last)/1000,.03);last=t;vy+=1150*dt;y+=vy*dt;spawn+=dt;
if(spawn>1.15){spawn=0;const top=70+Math.random()*(innerHeight-360);pipes.push({x:innerWidth+20,top,gap:155,passed:false});coins.push({x:innerWidth+125,y:top+82+Math.random()*30})}
const speed=210+Math.min(score*3,85);
pipes.forEach(p=>{p.x-=speed*dt;if(!p.passed&&p.x+64<88){p.passed=true;score++}});
coins.forEach(c=>c.x-=speed*dt);
coins=coins.filter(c=>{if(c.x<125&&c.x>65&&Math.abs(c.y-y)<42){rc++;return false}return c.x>-40});
pipes=pipes.filter(p=>p.x>-100);render();
const hit=y<8||y>innerHeight-145||pipes.some(p=>p.x<125&&p.x+64>85&&(y<p.top+18||y>p.top+p.gap-18));
if(hit)end();else requestAnimationFrame(loop)}
function render(){app.innerHTML=`<div class="game" onclick="flap()"><div class="score">${score}</div><div class="run">🪙 ${rc}</div>${pipes.map(p=>`<div class="pipe" style="left:${p.x}px;top:0;height:${p.top}px"></div><div class="pipe" style="left:${p.x}px;top:${p.top+p.gap}px;height:${innerHeight-p.top-p.gap-72}px"></div>`).join("")}${coins.map(c=>`<div class="coin" style="left:${c.x}px;top:${c.y}px">🪙</div>`).join("")}<div class="player" style="top:${y-23}px;background:${skins[d.selected][2]}"><div class="mask">● ●</div></div><div class="ground"></div></div>`}
function end(){playing=false;d.coins+=rc;d.best=Math.max(d.best,score);d.m.score=Math.max(d.m.score,score);d.m.coins+=rc;d.m.games++;d.xp+=Math.max(5,score*3);while(d.xp>=100){d.xp-=100;d.level++}save();app.innerHTML=`<div class="overlay"><div><div class="big">VOL TERMINÉ</div><p>Score ${score} • 🪙 +${rc}</p><button onclick="start()">REJOUER</button><button class="alt" onclick="home()">MENU</button></div></div>`}
addEventListener("keydown",e=>{if(e.code==="Space")flap()});home();
</script></body></html>
