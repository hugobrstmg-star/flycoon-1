<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#07111f}
.top{height:64px;padding:10px 18px 0;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:27px;font-weight:900;letter-spacing:2px}.wallet{font-size:17px;font-weight:900;color:#ffd166}
.screen{height:calc(100% - 64px);overflow:auto;padding:12px 18px 24px}
.home{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero{position:relative;width:150px;height:150px;margin:4px auto 12px}
.glow{position:absolute;left:12px;top:12px;width:126px;height:126px;border-radius:63px;background:rgba(91,225,255,.15)}
.raccoon{position:absolute;left:25px;top:22px;width:100px;height:100px;border-radius:50px;background:#9b6433;box-shadow:0 18px 45px rgba(0,0,0,.45);animation:bob 1.7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ear{position:absolute;width:28px;height:28px;border-radius:14px;background:#5a351d;top:-5px}.ear.l{left:8px}.ear.r{right:8px}
.face{position:absolute;left:12px;top:31px;width:76px;height:42px;border-radius:22px;background:#f2f2f2}
.eye{position:absolute;width:9px;height:9px;border-radius:5px;background:#101722;top:46px}.eye.l{left:31px}.eye.r{right:31px}.nose{position:absolute;left:45px;top:61px;width:9px;height:7px;border-radius:5px;background:#101722}
.jet{position:absolute;left:-13px;top:45px;width:16px;height:34px;border-radius:5px;background:#687587}.flame{position:absolute;left:-9px;top:75px;width:9px;height:25px;background:#ff9f1c}
.tag{color:#99abc0;font-size:11px;font-weight:900;letter-spacing:2px}.level{font-size:13px;font-weight:900;margin-top:14px}
.xpbar,.missionbar{height:8px;background:#26364b;border-radius:8px;overflow:hidden}.xpbar{width:245px;margin:7px auto 12px}.fill{height:100%;background:#ff9f1c}
.primary,.secondary{border:0;border-radius:16px;color:#fff;font-weight:900}.primary{background:#ff9f1c;padding:16px 62px;font-size:20px;margin:7px;box-shadow:0 6px 0 #c86d00}.secondary{background:#111d2d;border:1px solid #31445f;padding:13px 28px;margin:5px;font-size:14px}
.grid{width:340px;max-width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .secondary{margin:0;padding:12px}
.best,.sub{color:#8799b0}.best{font-weight:800;margin-top:14px}.sub{font-size:13px;margin-bottom:14px}
.title{font-size:28px;font-weight:900;margin:6px 0}.card,.mission,.rank,.premium{background:#121f31;border:1px solid #21344e;border-radius:18px;padding:13px;margin:10px 0}.card{display:flex;align-items:center;gap:13px}.card.sel{border-color:#ff9f1c}
.skin{width:62px;height:62px;border-radius:31px;position:relative;flex:none}.skin:after{content:"●  ●";position:absolute;left:8px;right:8px;top:20px;background:#eee;color:#111;border-radius:18px;text-align:center;padding:7px 0;font-size:9px;letter-spacing:5px}
.meta{flex:1}.name{font-size:17px;font-weight:900}.rarity{font-size:10px;color:#ffb23c;font-weight:900}.price{font-size:12px;color:#9fb1c6;font-weight:800}.missionbar{margin:11px 0 8px}
.claim{background:#26364b;border:0;color:#fff;padding:10px 13px;border-radius:11px;font-weight:900}.claim.ready{background:#ff9f1c}.rank{display:flex;align-items:center}.rank .pts{margin-left:auto;font-weight:900}.back{text-align:center;color:#ffb23c;font-weight:900;padding:17px}
.premium button{background:#8257e5;border:0;color:#fff;font-weight:900;border-radius:12px;padding:11px 15px;margin-top:9px}
.game{position:absolute;left:0;top:0;right:0;bottom:0;background:#62c9df;overflow:hidden;touch-action:none}
#gameCanvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:16px;left:0;right:0;text-align:center;pointer-events:none}.score{font-size:52px;font-weight:900;text-shadow:0 3px 4px #245b6d}.pause{position:absolute;right:15px;top:16px;z-index:5;width:42px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(7,17,31,.65);color:#fff;font-weight:900}
.overlay{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(6,16,27,.92);z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px}.modal{width:360px;max-width:100%;background:#101c2d;border:1px solid #263954;border-radius:24px;padding:24px}.big{font-size:34px;font-weight:900}.stats{display:flex;justify-content:space-around;margin:18px 0}.stats b{display:block;font-size:21px}.stats span{font-size:11px;color:#91a4bb}
#errorBox{display:none;position:absolute;left:12px;right:12px;bottom:12px;background:#3c1220;color:#fff;border-radius:12px;padding:10px;font-size:12px;z-index:100}

/* V5.3 GRAPHICS UPGRADE */
body{background:
radial-gradient(circle at 50% -10%,rgba(40,124,180,.25),transparent 45%),
linear-gradient(#07111f,#04080e)}

background:linear-gradient(180deg,rgba(7,17,31,.92),rgba(7,17,31,.55),transparent)}

filter:blur(3px)}
.raccoon{border:3px solid rgba(255,255,255,.08);box-shadow:
0 18px 42px rgba(0,0,0,.5),inset 0 8px 16px rgba(255,255,255,.10),inset 0 -10px 18px rgba(0,0,0,.2)}
.face{box-shadow:inset 0 -4px 7px rgba(0,0,0,.09)}
.jet{background:linear-gradient(90deg,#4b5666,#8996a8,#4b5666);box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.flame{background:linear-gradient(#fff7a8,#ffc93d 35%,#ff8d1a 68%,#ff3d31);
clip-path:polygon(50% 100%,0 0,100% 0);filter:drop-shadow(0 3px 5px rgba(255,110,0,.5));animation:thruster .16s alternate infinite}
@keyframes thruster{from{height:19px;transform:scaleX(.82)}to{height:31px;transform:scaleX(1.08)}}
.primary{background:linear-gradient(180deg,#ffbb47,#ff9817 55%,#f18700);
box-shadow:0 7px 0 #b86200,0 15px 28px rgba(255,159,28,.26),inset 0 1px 0 rgba(255,255,255,.3)}
.secondary,.card,.mission,.rank,.premium{
backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
box-shadow:0 10px 30px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.035)}
.card{transition:transform .12s ease,border-color .12s ease}.card:active{transform:scale(.985)}
.skin{box-shadow:inset 0 5px 12px rgba(255,255,255,.12),inset 0 -7px 12px rgba(0,0,0,.18),0 8px 20px rgba(0,0,0,.22)}
.game{background:#55c6df}
.hud .score{font-size:56px;text-shadow:0 4px 0 rgba(25,95,116,.45),0 0 22px rgba(255,255,255,.18)}
.pause{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 20px rgba(0,0,0,.16)}

/* V5.4 WORLDS & PROGRESSION */
.worldBadge{position:absolute;left:14px;top:16px;z-index:6;background:rgba(7,17,31,.62);
border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
padding:9px 12px;border-radius:14px;font-size:12px;font-weight:900;letter-spacing:.4px}

<body>
<div id="app">
  <div class="top">
    <div class="logo">FLYCOON</div>
    <div class="wallet" id="walletStatic">🪙 0</div>
  </div>
  <div class="screen home" id="staticHome">
    <div class="hero">
      <div class="glow"></div>

    <div class="grid">
      <button class="secondary" id="staticMissions">🎯 MISSIONS</button>
      <button class="secondary" id="staticRank">🏆 CLASSEMENT</button>
    </div>

      <button class="secondary" id="staticSound">🔊 SON</button>
    </div>

  </div>

</div>

<script>
(function(){
"use strict";

var app=document.getElementById("app");
var errorBox=document.getElementById("errorBox");
window.onerror=function(msg,url,line){
  errorBox.style.display="block";
  errorBox.innerHTML="Erreur Safari : "+String(msg)+" (ligne "+String(line||"?")+")";
};

function clone(obj){return JSON.parse(JSON.stringify(obj));}
function today(){return new Date().toISOString().slice(0,10);}
var SKINS=[
["Nova",0,"#9b6433","COMMUN"],["Pixel",350,"#303746","COMMUN"],["Cyber",650,"#e28b49","COMMUN"],["Rush",1000,"#49b85b","RARE"],
["Blaze",1500,"#f07832","RARE"],["Shadow",2200,"#242b42","RARE"],["Neon",3000,"#6b63e8","RARE"],["Ice",3800,"#68c9e8","ÉPIQUE"],
["Jungle",4700,"#3ba86b","ÉPIQUE"],["Royal",5800,"#7c5cc7","ÉPIQUE"],["Cosmo",7000,"#8067d8","ÉPIQUE"],["Gold",8500,"#f5bd32","LÉGENDAIRE"],
["Ruby",10000,"#d94c55","LÉGENDAIRE"],["Aqua",12000,"#3dbbd1","LÉGENDAIRE"],["Storm",14500,"#6688a9","LÉGENDAIRE"],["Solar",17000,"#e5b43d","LÉGENDAIRE"],
["Lava",20000,"#df5a32","LÉGENDAIRE"],["Mint",23000,"#62c7a0","MYTHIQUE"],["Violet",27000,"#a66ee8","MYTHIQUE"],["Chrome",32000,"#bfc9d6","MYTHIQUE"],
["Phantom",38000,"#4c536a","MYTHIQUE"],["Galaxy",45000,"#5d6ee5","MYTHIQUE"],["Legend",55000,"#d6a33b","LÉGENDE"],["Ultra",70000,"#f04a8b","LÉGENDE"]
];
var MISSIONS=[
{id:"score",title:"As du ciel",desc:"Atteins 20 points",goal:20,reward:250},
{id:"coins",title:"Ruée vers l'or",desc:"Ramasse 20 pièces",goal:20,reward:300},
{id:"games",title:"Toujours plus haut",desc:"Termine 5 parties",goal:5,reward:200}
];
var DEFAULT={coins:0,best:0,level:1,xp:0,owned:[0],selected:0,games:0,dailyDate:today(),missions:{score:0,coins:0,games:0},claimed:{},sound:true};
var data=clone(DEFAULT);

try{
  var raw=localStorage.getItem("flycoonV52");
  if(raw){
    var parsed=JSON.parse(raw);
    var key;
    for(key in parsed){if(parsed.hasOwnProperty(key)){data[key]=parsed[key];}}
  }
}catch(e){}

if(!data.owned||!data.owned.length){data.owned=[0];}
if(typeof data.selected!=="number"||!SKINS[data.selected]){data.selected=0;}
if(!data.missions){data.missions={score:0,coins:0,games:0};}
if(!data.claimed){data.claimed={};}
if(data.dailyDate!==today()){data.dailyDate=today();data.missions={score:0,coins:0,games:0};data.claimed={};}

function save(){try{localStorage.setItem("flycoonV52",JSON.stringify(data));}catch(e){}}
function xpTarget(level){return 120+(level-1)*45;}
function header(){return '<div class="top"><div class="logo">FLYCOON</div><div class="wallet">🪙 '+data.coins+'</div></div>';}
function makeRaccoon(color){return '<div class="hero"><div class="glow"></div><div class="raccoon" style="background:'+color+'"><i class="ear l"></i><i class="ear r"></i><div class="face"></div><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><div class="jet"></div><div class="flame"></div></div></div>';}

function home(){
  var s=SKINS[data.selected]||SKINS[0];
  var pct=Math.min(100,(data.xp/xpTarget(data.level))*100);
  app.innerHTML=header()+
  '<div class="screen home">'+makeRaccoon(s[2])+
  '<div class="tag">FLY • COLLECT • MASTER</div>'+
  '<div class="level">NIVEAU '+data.level+'</div>'+
  '<div class="xpbar"><div class="fill" style="width:'+pct+'%"></div></div>'+
  '<button class="primary" id="playBtn">JOUER</button>'+
  '<button class="secondary" id="shopBtn">🛒 BOUTIQUE • 24 SKINS</button>'+
  '<div class="grid"><button class="secondary" id="missionsBtn">🎯 MISSIONS</button><button class="secondary" id="rankBtn">🏆 CLASSEMENT</button></div>'+
  '<div class="grid" style="margin-top:8px"><button class="secondary" id="premiumBtn">💎 PREMIUM</button><button class="secondary" id="soundBtn">🔊 '+(data.sound?'SON':'MUET')+'</button></div>'+
  '<div class="best">🏆 RECORD : '+data.best+'</div><div class="sub">FLYCOON V5.5 • Safari iPhone</div></div><div id="errorBox"></div>';
  document.getElementById("playBtn").onclick=startGame;
  document.getElementById("shopBtn").onclick=shop;
  document.getElementById("missionsBtn").onclick=missions;
  document.getElementById("rankBtn").onclick=ranking;
  document.getElementById("premiumBtn").onclick=premium;
  document.getElementById("soundBtn").onclick=function(){data.sound=!data.sound;save();home();};
}

function shop(){
  var h=header()+'<div class="screen"><div class="title">BOUTIQUE</div><div class="sub">24 pilotes à débloquer.</div>';
  var i,s,owned;
  for(i=0;i<SKINS.length;i++){
    s=SKINS[i];owned=data.owned.indexOf(i)>=0;
    h+='<div class="card '+(i===data.selected?'sel':'')+'" data-buy="'+i+'"><div class="skin" style="background:'+s[2]+'"></div><div class="meta"><div class="name">'+s[0]+'</div><div class="rarity">'+s[3]+'</div><div class="price">'+(owned?(data.selected===i?'ÉQUIPÉ':'POSSÉDÉ'):'🪙 '+s[1])+'</div></div></div>';
  }
  h+='<div class="back" id="backBtn">← RETOUR</div></div>';
  app.innerHTML=h;
  var cards=document.querySelectorAll("[data-buy]");
  for(i=0;i<cards.length;i++){
    cards[i].onclick=function(){buy(parseInt(this.getAttribute("data-buy"),10));};
  }
  document.getElementById("backBtn").onclick=home;
}

function buy(i){
  var s=SKINS[i];
  if(data.owned.indexOf(i)>=0){data.selected=i;}
  else if(data.coins>=s[1]){data.coins-=s[1];data.owned.push(i);data.selected=i;}
  else{alert("Pas assez de pièces !");return;}
  save();shop();
}

function missions(){
  var h=header()+'<div class="screen"><div class="title">MISSIONS DU JOUR</div><div class="sub">'+new Date().toLocaleDateString("fr-FR")+'</div>';
  var i,m,v,ready,claimed;
  for(i=0;i<MISSIONS.length;i++){
    m=MISSIONS[i];v=Math.min(data.missions[m.id]||0,m.goal);ready=v>=m.goal;claimed=!!data.claimed[m.id];
    h+='<div class="mission"><div class="name">'+m.title+'</div><div class="sub">'+m.desc+'</div><div class="missionbar"><div class="fill" style="width:'+(v/m.goal*100)+'%"></div></div><div class="price">'+v+'/'+m.goal+' • 🪙 '+m.reward+'</div><button class="claim '+(ready&&!claimed?'ready':'')+'" data-claim="'+m.id+'">'+(claimed?'RÉCOMPENSE PRISE':ready?'RÉCUPÉRER':'EN COURS')+'</button></div>';
  }
  h+='<div class="back" id="backBtn">← RETOUR</div></div>';
  app.innerHTML=h;
  var buttons=document.querySelectorAll("[data-claim]");
  for(i=0;i<buttons.length;i++){
    buttons[i].onclick=function(){claim(this.getAttribute("data-claim"));};
  }
  document.getElementById("backBtn").onclick=home;
}

function claim(id){
  var i,m;
  for(i=0;i<MISSIONS.length;i++){
    if(MISSIONS[i].id===id){
      m=MISSIONS[i];
      if((data.missions[id]||0)>=m.goal&&!data.claimed[id]){
        data.coins+=m.reward;data.claimed[id]=true;save();missions();
      }
      return;
    }
  }
}

function ranking(){
  var list=[["Toi",data.best],["NovaPilot",312],["PixelKing",248],["RaccoonX",205],["SkyMaster",181]];
  var h=header()+'<div class="screen"><div class="title">CLASSEMENT</div><div class="sub">Démo locale.</div>';
  var i;
  for(i=0;i<list.length;i++){
    h+='<div class="rank"><b>#'+(i+1)+'</b><span style="margin-left:18px">'+list[i][0]+'</span><span class="pts">'+list[i][1]+'</span></div>';
  }
  h+='<div class="back" id="backBtn">← RETOUR</div></div>';
  app.innerHTML=h;
  document.getElementById("backBtn").onclick=home;
}

function premium(){
  app.innerHTML=header()+'<div class="screen"><div class="title">FLYCOON PREMIUM</div><div class="premium"><div class="name">🎬 Bonus test</div><div class="sub">+100 pièces dans cette version.</div><button id="bonusBtn">RÉCUPÉRER +100</button></div><div class="premium"><div class="name">💎 Pack 1 000 pièces</div><div class="sub">Achat intégré à connecter.</div><button id="iapBtn">ACHETER</button></div><div class="back" id="backBtn">← RETOUR</div></div>';
  document.getElementById("bonusBtn").onclick=function(){data.coins+=100;save();premium();};
  document.getElementById("iapBtn").onclick=function(){alert("Paiement réel non activé dans cette démo.");};
  document.getElementById("backBtn").onclick=home;
}

var audioContext=null;
function tone(freq,dur,vol){
  if(!data.sound){return;}
  try{
    if(!audioContext){audioContext=new (window.AudioContext||window.webkitAudioContext)();}
    var osc=audioContext.createOscillator();
    var gain=audioContext.createGain();
    osc.frequency.value=freq;
    gain.gain.value=vol;
    osc.connect(gain);gain.connect(audioContext.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001,audioContext.currentTime+dur);
    osc.stop(audioContext.currentTime+dur);
  }catch(e){}
}


var WORLDS=[
 {name:"Prairie",emoji:"🌤",from:0,sky1:"#3fb8df",sky2:"#e0f8f5",hill1:"#77c777",hill2:"#54a957",pipe1:"#53d75b",pipe2:"#218e35",ground1:"#e4c26a",ground2:"#b9893f",type:"pipe"},
 {name:"Forêt",emoji:"🌲",from:10,sky1:"#4aa8b7",sky2:"#cfeee2",hill1:"#3f9f69",hill2:"#25724f",pipe1:"#7dbb3e",pipe2:"#39782d",ground1:"#9a7a43",ground2:"#65472b",type:"trunk"},
 {name:"Désert",emoji:"🏜",from:25,sky1:"#efb45c",sky2:"#ffe4a6",hill1:"#d89a4c",hill2:"#b86b35",pipe1:"#d08b38",pipe2:"#9e5a27",ground1:"#e5b65e",ground2:"#c98a3b",type:"rock"},
 {name:"Nuit",emoji:"🌙",from:45,sky1:"#172b5c",sky2:"#46528c",hill1:"#364b67",hill2:"#233246",pipe1:"#7262d9",pipe2:"#3d317f",ground1:"#675e78",ground2:"#3e3948",type:"crystal"},
 {name:"Volcan",emoji:"🌋",from:70,sky1:"#5f2a32",sky2:"#c25a3c",hill1:"#6f382f",hill2:"#3d241f",pipe1:"#8d4a2e",pipe2:"#4d251b",ground1:"#7b3a22",ground2:"#3f2117",type:"lava"},
 {name:"Cosmos",emoji:"🪐",from:100,sky1:"#170f3a",sky2:"#3a2c78",hill1:"#423d76",hill2:"#211d48",pipe1:"#6f7bea",pipe2:"#3f48a8",ground1:"#49446b",ground2:"#24213d",type:"tech"}
];
var currentWorldIndex=0;
function getWorldIndex(sc){
  var idx=0,i;
  for(i=0;i<WORLDS.length;i++){if(sc>=WORLDS[i].from)idx=i;}
  return idx;
}
function updateWorldUI(force){
  var idx=getWorldIndex(score);
  if(force||idx!==currentWorldIndex){
    currentWorldIndex=idx;
    var b=document.getElementById("worldBadge");
    if(b)b.innerHTML=WORLDS[idx].emoji+" "+WORLDS[idx].name;
    if(!force){
      var f=document.getElementById("worldFlash");
      if(f){f.className="worldFlash";void f.offsetWidth;f.className="worldFlash show";}
      tone(760,0.12,0.03);
    }
  }
}

var canvas,ctx,W,H,DPR,player,pipes,gameCoins,particles,score,runCoins,last,spawn,playing,started,paused,raf;

function startGame(){
  app.innerHTML='<div class="game"><canvas id="gameCanvas"></canvas><div class="worldBadge" id="worldBadge">🌤 Prairie</div><div class="hud"><div class="score" id="scoreText">0</div><b id="coinText">🪙 0</b></div><button class="pause" id="pauseBtn">Ⅱ</button><div class="worldFlash" id="worldFlash"></div></div>';
  canvas=document.getElementById("gameCanvas");
  ctx=canvas.getContext("2d");
  resizeCanvas();
  player={x:Math.max(82,W*0.23),y:H*0.44,vy:0,r:18};currentWorldIndex=0;
  pipes=[];gameCoins=[];particles=[];score=0;runCoins=0;spawn=0;playing=true;started=false;paused=false;last=new Date().getTime();
  canvas.ontouchstart=function(e){if(e&&e.preventDefault){e.preventDefault();}flap();return false;};
  canvas.onmousedown=function(e){if(e&&e.preventDefault){e.preventDefault();}flap();return false;};
  document.getElementById("pauseBtn").onclick=function(e){if(e&&e.stopPropagation){e.stopPropagation();}paused=!paused;this.innerHTML=paused?"▶":"Ⅱ";last=new Date().getTime();};
  updateWorldUI(true);
  draw();
  raf=requestAnimationFrame(loop);
}

function resizeCanvas(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

function flap(){
  if(!playing||paused){return;}
  started=true;player.vy=-365;tone(470,0.06,0.03);
}

function addPipe(){
  var wi=getWorldIndex(score),wld=WORLDS[wi];
  var baseGap=Math.max(165,H*0.19);
  var gap=Math.max(138,baseGap-Math.min(score*.22,28));
  var range=Math.max(20,H-76-gap-195);
  var top=90+Math.random()*range;
  var width=68,variant="normal";

  if(score>=12&&Math.random()<.20){width=88;variant="wide";}
  if(score>=30&&Math.random()<.18){gap=Math.max(140,gap-12);variant="tight";}
  if(score>=55&&Math.random()<.15){width=56;variant="slim";}

  pipes.push({
    x:W+40,w:width,top:top,gap:gap,passed:false,
    world:wi,type:wld.type,variant:variant,
    wobble:(score>=35&&Math.random()<.20)?(Math.random()*.8+.3):0,
    baseTop:top,phase:Math.random()*6.28
  });

  if(Math.random()>0.10){
    var coinY=top+gap/2+(Math.random()*34-17);
    gameCoins.push({x:W+125,y:coinY,r:13,a:0});
    if(score>=40&&Math.random()<.20){
      gameCoins.push({x:W+158,y:coinY-24,r:11,a:1.2});
      gameCoins.push({x:W+190,y:coinY+18,r:11,a:2.1});
    }
  }
}

function loop(){
  if(!playing){return;}
  var now=new Date().getTime();
  var dt=Math.min((now-last)/1000,0.028);
  last=now;
  if(!paused){update(dt,now/1000);}
  updateWorldUI(true);
  draw();
  raf=requestAnimationFrame(loop);
}

function update(dt,time){
  var i,q,dx,dy,speed;
  if(started){player.vy+=930*dt;player.y+=player.vy*dt;}
  else{player.y=H*0.44+Math.sin(time*3)*4;}
  spawn+=dt;
  if(spawn>1.48){spawn=0;addPipe();}
  speed=188+Math.min(score*2.8,82);
  for(i=0;i<pipes.length;i++){
    q=pipes[i];q.x-=speed*dt;
    if(q.wobble){
      q.phase+=dt*q.wobble;
      q.top=q.baseTop+Math.sin(q.phase)*Math.min(24,10+score*.08);
    }
    if(!q.passed&&q.x+q.w<player.x){q.passed=true;score++;document.getElementById("scoreText").innerHTML=score;tone(620,0.04,0.02);updateWorldUI(false);}
  }
  for(i=0;i<gameCoins.length;i++){gameCoins[i].x-=speed*dt;gameCoins[i].a+=dt*6;}
  for(i=gameCoins.length-1;i>=0;i--){
    q=gameCoins[i];dx=q.x-player.x;dy=q.y-player.y;
    if(dx*dx+dy*dy<(q.r+player.r)*(q.r+player.r)){
      gameCoins.splice(i,1);runCoins++;document.getElementById("coinText").innerHTML="🪙 "+runCoins;tone(980,0.09,0.05);burst(player.x,player.y);
    }
  }
  for(i=0;i<particles.length;i++){particles[i].x+=particles[i].vx*dt;particles[i].y+=particles[i].vy*dt;particles[i].life-=dt;}
  particles=particles.filter(function(x){return x.life>0;});
  pipes=pipes.filter(function(x){return x.x+x.w>-40;});
  gameCoins=gameCoins.filter(function(x){return x.x>-40;});
  if(started&&collision()){finishGame();}
}

function collision(){
  if(player.y-player.r<0||player.y+player.r>H-76){return true;}
  var i,q;
  for(i=0;i<pipes.length;i++){
    q=pipes[i];
    if(player.x+player.r>q.x&&player.x-player.r<q.x+q.w&&(player.y-player.r<q.top||player.y+player.r>q.top+q.gap)){return true;}
  }
  return false;
}

function burst(x,y){
  var i,a,s;
  for(i=0;i<12;i++){a=Math.random()*6.28;s=50+Math.random()*100;particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.5});}
}

function draw(){
  var wi=getWorldIndex(score);
  if(wi<0||wi>=WORLDS.length){wi=0;}
  var world=WORLDS[wi];
  var i,x,now=(new Date().getTime()/1000);

  // Safari-safe renderer: simple canvas primitives only.
  ctx.save();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalAlpha=1;
  ctx.fillStyle=world.sky1||"#62c5f4";
  ctx.fillRect(0,0,W,H);

  // sky lower band
  ctx.fillStyle=world.sky2||"#dff5ff";
  ctx.globalAlpha=.42;
  ctx.fillRect(0,H*.42,W,H*.58);
  ctx.globalAlpha=1;

  // sun / moon
  ctx.fillStyle=(world.name==="Nuit"||world.name==="Cosmos")?"#eef2ff":"#fff1a6";
  ctx.beginPath();ctx.arc(W*.78,H*.15,30,0,6.283);ctx.fill();

  if(world.name==="Nuit"||world.name==="Cosmos"){
    ctx.fillStyle="#ffffff";
    for(i=0;i<22;i++){ctx.fillRect((i*71)%W,35+(i*43)%Math.max(100,H*.45),2,2);}
  }else{
    drawCloudSafe(((W*.2-now*9)%(W+150)+W+150)%(W+150)-70,H*.18,1);
    drawCloudSafe(((W*.72-now*6)%(W+170)+W+170)%(W+170)-80,H*.28,.75);
  }

  // distant scenery
  if(world.name==="Désert"){
    ctx.fillStyle="#d89a52";ctx.beginPath();ctx.moveTo(0,H-145);
    ctx.quadraticCurveTo(W*.25,H-215,W*.52,H-150);
    ctx.quadraticCurveTo(W*.76,H-205,W,H-145);
    ctx.lineTo(W,H-76);ctx.lineTo(0,H-76);ctx.fill();
  }else if(world.name==="Volcan"){
    ctx.fillStyle="#3d2b2d";ctx.beginPath();ctx.moveTo(0,H-135);
    ctx.lineTo(W*.24,H-245);ctx.lineTo(W*.43,H-145);
    ctx.lineTo(W*.68,H-275);ctx.lineTo(W,H-140);
    ctx.lineTo(W,H-76);ctx.lineTo(0,H-76);ctx.fill();
  }else{
    ctx.fillStyle=world.hill1||"#78b96b";ctx.beginPath();ctx.moveTo(0,H-135);
    ctx.quadraticCurveTo(W*.22,H-210,W*.46,H-145);
    ctx.quadraticCurveTo(W*.70,H-225,W,H-140);
    ctx.lineTo(W,H-76);ctx.lineTo(0,H-76);ctx.fill();
    ctx.fillStyle=world.hill2||"#5a9e55";ctx.beginPath();ctx.moveTo(0,H-105);
    ctx.quadraticCurveTo(W*.28,H-160,W*.55,H-112);
    ctx.quadraticCurveTo(W*.78,H-165,W,H-110);
    ctx.lineTo(W,H-76);ctx.lineTo(0,H-76);ctx.fill();
  }

  for(i=0;i<pipes.length;i++){drawPipeSafe(pipes[i]);}
  for(i=0;i<gameCoins.length;i++){drawCoinSafe(gameCoins[i]);}
  drawPlayerSafe();

  // ground drawn last, like classic side-scrollers
  ctx.fillStyle=world.ground1||"#62a94d";ctx.fillRect(0,H-76,W,76);
  ctx.fillStyle=(world.name==="Volcan")?"#ff6a1f":(world.name==="Cosmos"?"#7772d6":"#7ac957");
  ctx.fillRect(0,H-82,W,8);
  ctx.fillStyle=world.ground2||"#477f3e";ctx.fillRect(0,H-52,W,52);
  ctx.restore();
}

function drawCloudSafe(x,y,s){
  ctx.save();ctx.globalAlpha=.7;ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.arc(x,y,18*s,0,6.283);ctx.arc(x+23*s,y-8*s,25*s,0,6.283);
  ctx.arc(x+50*s,y,18*s,0,6.283);ctx.fill();
  ctx.fillRect(x,y,50*s,18*s);ctx.restore();
}

function drawPipeSafe(q){
  var wi=(typeof q.world==="number")?q.world:0;
  if(wi<0||wi>=WORLDS.length){wi=0;}
  var world=WORLDS[wi], bottom=q.top+q.gap;
  var fill=world.pipe1||"#3f9b58", edge=world.pipe2||"#286d40";
  if(q.type==="trunk"){fill="#79502f";edge="#4b301e";}
  if(q.type==="rock"){fill="#b96e43";edge="#79442c";}
  if(q.type==="crystal"){fill="#7366d8";edge="#42388f";}
  if(q.type==="lava"){fill="#654035";edge="#36231e";}
  if(q.type==="tech"){fill="#5968c9";edge="#303a88";}
  ctx.fillStyle=edge;ctx.fillRect(q.x-3,0,q.w+6,q.top);
  ctx.fillRect(q.x-3,bottom,q.w+6,Math.max(0,H-76-bottom));
  ctx.fillStyle=fill;ctx.fillRect(q.x,0,q.w,q.top);
  ctx.fillRect(q.x,bottom,q.w,Math.max(0,H-76-bottom));
  ctx.fillStyle=edge;ctx.fillRect(q.x-6,Math.max(0,q.top-18),q.w+12,18);
  ctx.fillRect(q.x-6,bottom,q.w+12,18);
}

function drawCoinSafe(c){
  ctx.save();ctx.translate(c.x,c.y);
  ctx.fillStyle="#f6b91f";ctx.beginPath();ctx.arc(0,0,c.r,0,6.283);ctx.fill();
  ctx.fillStyle="#ffe889";ctx.beginPath();ctx.arc(-3,-4,c.r*.35,0,6.283);ctx.fill();
  ctx.fillStyle="#b77b0a";ctx.font="bold "+Math.max(10,c.r)+"px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("F",0,1);
  ctx.restore();
}

function drawPlayerSafe(){
  if(!player){return;}
  var s=SKINS[data.selected]||SKINS[0];
  var body=s[2]||"#78838b";
  ctx.save();ctx.translate(player.x,player.y);
  ctx.rotate(Math.max(-.35,Math.min(.65,player.vy/650)));

  // jetpack and flame
  ctx.fillStyle="#56616d";ctx.fillRect(-30,-9,11,23);
  ctx.fillStyle="#ff9b24";ctx.beginPath();ctx.moveTo(-29,14);ctx.lineTo(-24,31);ctx.lineTo(-19,14);ctx.fill();

  // ears
  ctx.fillStyle="#5b3925";ctx.beginPath();ctx.arc(-11,-14,7,0,6.283);ctx.arc(11,-14,7,0,6.283);ctx.fill();

  // body
  ctx.fillStyle=body;ctx.beginPath();ctx.arc(0,0,player.r,0,6.283);ctx.fill();

  // face
  ctx.fillStyle="#eef2f2";ctx.beginPath();ctx.ellipse(0,2,14,10,0,0,6.283);ctx.fill();
  ctx.fillStyle="#626d76";ctx.beginPath();ctx.ellipse(-6,0,5,4,0,0,6.283);ctx.ellipse(6,0,5,4,0,0,6.283);ctx.fill();
  ctx.fillStyle="#111820";ctx.beginPath();ctx.arc(-6,0,2.5,0,6.283);ctx.arc(6,0,2.5,0,6.283);ctx.arc(0,7,2.8,0,6.283);ctx.fill();

  // tail
  ctx.strokeStyle=body;ctx.lineWidth=7;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(12,10);ctx.quadraticCurveTo(31,19,27,0);ctx.stroke();
  ctx.restore();
}

function finishGame(){
  if(!playing){return;}
  playing=false;cancelAnimationFrame(raf);tone(130,0.2,0.06);
  data.coins+=runCoins;data.best=Math.max(data.best,score);data.games++;
  data.missions.score=Math.max(data.missions.score||0,score);
  data.missions.coins=(data.missions.coins||0)+runCoins;
  data.missions.games=(data.missions.games||0)+1;
  var gained=Math.max(8,score*4+runCoins*2);
  data.xp+=gained;
  while(data.level<50&&data.xp>=xpTarget(data.level)){data.xp-=xpTarget(data.level);data.level++;}
  save();
  app.innerHTML+='<div class="overlay"><div class="modal"><div class="big">VOL TERMINÉ</div><div class="stats"><div><b>'+score+'</b><span>SCORE</span></div><div><b>🪙 '+runCoins+'</b><span>PIÈCES</span></div><div><b>+'+gained+'</b><span>XP</span></div></div><button class="primary" id="replayBtn">REJOUER</button><button class="secondary" id="menuBtn">MENU</button></div></div>';
  document.getElementById("replayBtn").onclick=startGame;
  document.getElementById("menuBtn").onclick=home;
}

/* Static menu is visible BEFORE JS. These bindings make even partial JS startup usable. */
document.getElementById("walletStatic").innerHTML="🪙 "+data.coins;
document.getElementById("staticLevel").innerHTML="NIVEAU "+data.level;
document.getElementById("staticXp").style.width=Math.min(100,(data.xp/xpTarget(data.level))*100)+"%";
document.getElementById("staticBest").innerHTML="🏆 RECORD : "+data.best;
document.getElementById("staticRaccoon").style.background=(SKINS[data.selected]||SKINS[0])[2];
document.getElementById("staticPlay").onclick=startGame;
document.getElementById("staticShop").onclick=shop;
document.getElementById("staticMissions").onclick=missions;
document.getElementById("staticRank").onclick=ranking;
document.getElementById("staticPremium").onclick=premium;
document.getElementById("staticSound").onclick=function(){data.sound=!data.sound;save();home();};

/* Replace static home only after everything above has parsed successfully. */
setTimeout(home,50);

})();

</script>
</body>
