<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07111f">
<title>FLYCOON V5.1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button{font:inherit}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 12%,#173350 0,#07111f 48%,#050a12 100%)}
#boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;background:#07111f;z-index:99}
#boot b{font-size:34px;letter-spacing:2px}#boot p{color:#91a4bb}
.top{height:72px;padding:calc(env(safe-area-inset-top) + 10px) 18px 0;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:28px;font-weight:900;letter-spacing:2px}.wallet{color:#ffd166;font-weight:900}
.screen{height:calc(100% - 72px);overflow:auto;padding:12px 18px calc(env(safe-area-inset-bottom) + 18px)}
.home{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.hero{position:relative;width:150px;height:150px;margin:5px 0 12px}.glow{position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle,#65e6ff44,transparent 70%);animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.65}}@keyframes bob{50%{transform:translateY(-9px) rotate(2deg)}}
.raccoon{position:absolute;left:25px;top:22px;width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;animation:bob 1.7s ease-in-out infinite;box-shadow:0 18px 45px #0008,inset 0 -7px 0 #0002}
.ear{position:absolute;width:28px;height:28px;border-radius:50%;background:#5a351d;top:-5px}.ear.l{left:8px}.ear.r{right:8px}
.face{position:absolute;width:76px;height:42px;border-radius:24px;background:#f2f2f2;top:31px}.eye{position:absolute;width:9px;height:9px;border-radius:50%;background:#101722;top:46px}.eye.l{left:31px}.eye.r{right:31px}.nose{position:absolute;width:9px;height:7px;border-radius:50%;background:#101722;top:61px}
.jet{position:absolute;left:-13px;top:45px;width:16px;height:34px;border-radius:5px;background:#687587}.flame{position:absolute;left:-9px;top:75px;width:9px;height:25px;background:linear-gradient(#fff36a,#ff9f1c,#ff3b30);clip-path:polygon(50% 100%,0 0,100% 0)}
.tag{color:#99abc0;font-size:11px;font-weight:900;letter-spacing:2px}.xpbar,.missionbar{height:8px;background:#26364b;border-radius:8px;overflow:hidden}.xpbar{width:245px;margin:7px 0 12px}.fill{height:100%;background:linear-gradient(90deg,#ff9f1c,#ffd166)}
.primary,.secondary{border:0;color:#fff;font-weight:900;border-radius:16px}.primary{background:linear-gradient(#ffb43b,#ff9010);padding:16px 62px;font-size:20px;box-shadow:0 7px 0 #c86d00;margin:7px}.secondary{background:#111d2d;border:1px solid #31445f;padding:13px 28px;margin:5px;font-size:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(100%,340px)}.grid2 .secondary{margin:0;padding:12px}.best,.sub{color:#8799b0}.best{font-weight:800;margin-top:14px}.sub{font-size:13px;margin-bottom:14px}
.title{font-size:28px;font-weight:900;margin:6px 0}.card,.mission,.rank,.premium{background:linear-gradient(#142237,#101a2a);border:1px solid #21344e;border-radius:18px;padding:13px;margin:10px 0}.card{display:flex;align-items:center;gap:13px}.card.sel{border-color:#ff9f1c}.skin{width:62px;height:62px;border-radius:50%;position:relative;flex:none}.skin:after{content:"●  ●";position:absolute;left:8px;right:8px;top:20px;background:#eee;color:#111;border-radius:18px;text-align:center;padding:7px 0;font-size:9px;letter-spacing:5px}.meta{flex:1}.name{font-size:17px;font-weight:900}.rarity{font-size:10px;color:#ffb23c;font-weight:900}.price{font-size:12px;color:#9fb1c6;font-weight:800}.missionbar{margin:11px 0 8px}.claim{background:#26364b;border:0;color:#fff;padding:10px 13px;border-radius:11px;font-weight:900}.claim.ready{background:#ff9f1c}.rank{display:flex;align-items:center}.rank b:last-child{margin-left:auto}.back{text-align:center;color:#ffb23c;font-weight:900;padding:17px}.premium button{background:#8257e5;border:0;color:#fff;font-weight:900;border-radius:12px;padding:11px 15px;margin-top:9px}
.game{position:absolute;inset:0;overflow:hidden;background:#63cbe2;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:0;right:0;text-align:center;pointer-events:none}.score{font-size:54px;font-weight:900;text-shadow:0 3px 4px #245b6d}.pause{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 16px);z-index:5;background:#07111f99;border:1px solid #ffffff25;color:#fff;width:42px;height:42px;border-radius:14px;font-weight:900}
.overlay{position:absolute;inset:0;background:#06101be8;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px}.modal{width:min(360px,100%);background:linear-gradient(#132237,#0d1726);border:1px solid #263954;border-radius:24px;padding:24px}.big{font-size:34px;font-weight:900}.stats{display:flex;justify-content:space-around;margin:18px 0}.stats b{display:block;font-size:21px}.stats span{font-size:11px;color:#91a4bb}.toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:#07111fe8;border:1px solid #ffffff22;border-radius:14px;padding:10px 14px;font-weight:900;z-index:30}
</style>
</head>
<body>
<div id="app"><div id="boot"><div><b>FLYCOON</b><p>Chargement V5.1…</p></div></div></div>
<script>
(function(){
"use strict";
function today(){return new Date().toISOString().slice(0,10);}
var SKINS=[
["Nova",0,"#9b6433","COMMUN"],["Pixel",350,"#303746","COMMUN"],["Cyber",650,"#e28b49","COMMUN"],["Rush",1000,"#49b85b","RARE"],["Blaze",1500,"#f07832","RARE"],["Shadow",2200,"#242b42","RARE"],["Neon",3000,"#6b63e8","RARE"],["Ice",3800,"#68c9e8","ÉPIQUE"],["Jungle",4700,"#3ba86b","ÉPIQUE"],["Royal",5800,"#7c5cc7","ÉPIQUE"],["Cosmo",7000,"#8067d8","ÉPIQUE"],["Gold",8500,"#f5bd32","LÉGENDAIRE"],["Ruby",10000,"#d94c55","LÉGENDAIRE"],["Aqua",12000,"#3dbbd1","LÉGENDAIRE"],["Storm",14500,"#6688a9","LÉGENDAIRE"],["Solar",17000,"#e5b43d","LÉGENDAIRE"],["Lava",20000,"#df5a32","LÉGENDAIRE"],["Mint",23000,"#62c7a0","MYTHIQUE"],["Violet",27000,"#a66ee8","MYTHIQUE"],["Chrome",32000,"#bfc9d6","MYTHIQUE"],["Phantom",38000,"#4c536a","MYTHIQUE"],["Galaxy",45000,"#5d6ee5","MYTHIQUE"],["Legend",55000,"#d6a33b","LÉGENDE"],["Ultra",70000,"#f04a8b","LÉGENDE"]];
var MS=[{id:"score",title:"As du ciel",desc:"Atteins 20 points",goal:20,reward:250},{id:"coins",title:"Ruée vers l'or",desc:"Ramasse 20 pièces",goal:20,reward:300},{id:"games",title:"Toujours plus haut",desc:"Termine 5 parties",goal:5,reward:200}];
var DEF={coins:0,best:0,level:1,xp:0,owned:[0],selected:0,games:0,dailyDate:today(),missions:{score:0,coins:0,games:0},claimed:{},sound:true};
var data=JSON.parse(JSON.stringify(DEF));
try{
 var raw=window.localStorage?localStorage.getItem("flycoonV51"):null;
 if(raw){
  var parsed=JSON.parse(raw);
  for(var k in parsed){data[k]=parsed[k];}
 }
}catch(e){}
if(!data.owned||!data.owned.length)data.owned=[0];
if(typeof data.selected!=="number"||!SKINS[data.selected])data.selected=0;
if(!data.missions)data.missions={score:0,coins:0,games:0};
if(!data.claimed)data.claimed={};
if(data.dailyDate!==today()){data.dailyDate=today();data.missions={score:0,coins:0,games:0};data.claimed={};}
var app=document.getElementById("app");
function save(){try{if(window.localStorage)localStorage.setItem("flycoonV51",JSON.stringify(data));}catch(e){}}
function xpT(l){return 120+(l-1)*45;}
function top(){return '<div class="top"><div class="logo">FLYCOON</div><div class="wallet">🪙 '+data.coins+'</div></div>';}
function home(){
 var s=SKINS[data.selected]||SKINS[0],pct=Math.min(100,(data.xp/xpT(data.level))*100);
 app.innerHTML=top()+'<div class="screen home"><div class="hero"><div class="glow"></div><div class="raccoon" style="background:'+s[2]+'"><i class="ear l"></i><i class="ear r"></i><div class="face"></div><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><div class="jet"></div><div class="flame"></div></div></div><div class="tag">FLY • COLLECT • MASTER</div><h3>NIVEAU '+data.level+'</h3><div class="xpbar"><div class="fill" style="width:'+pct+'%"></div></div><button class="primary" id="play">JOUER</button><button class="secondary" id="shop">🛒 BOUTIQUE • 24 SKINS</button><div class="grid2"><button class="secondary" id="missions">🎯 MISSIONS</button><button class="secondary" id="rank">🏆 CLASSEMENT</button></div><div class="grid2"><button class="secondary" id="premium">💎 PREMIUM</button><button class="secondary" id="sound">🔊 '+(data.sound?'SON':'MUET')+'</button></div><div class="best">🏆 RECORD : '+data.best+'</div><div class="sub">FLYCOON V5.1 iPhone</div></div>';
 document.getElementById("play").onclick=startGame;
 document.getElementById("shop").onclick=shop;
 document.getElementById("missions").onclick=missions;
 document.getElementById("rank").onclick=rank;
 document.getElementById("premium").onclick=premium;
 document.getElementById("sound").onclick=function(){data.sound=!data.sound;save();home();};
}
function shop(){var h=top()+'<div class="screen"><div class="title">BOUTIQUE</div><div class="sub">24 pilotes à débloquer.</div>';for(var i=0;i<SKINS.length;i++){var s=SKINS[i];h+='<div class="card '+(i===data.selected?'sel':'')+'" data-buy="'+i+'"><div class="skin" style="background:'+s[2]+'"></div><div class="meta"><div class="name">'+s[0]+'</div><div class="rarity">'+s[3]+'</div><div class="price">'+(data.owned.indexOf(i)>=0?(data.selected===i?'ÉQUIPÉ':'POSSÉDÉ'):'🪙 '+s[1])+'</div></div></div>';}h+='<div class="back" id="back">← RETOUR</div></div>';app.innerHTML=h;var cards=document.querySelectorAll("[data-buy]");for(var j=0;j<cards.length;j++){cards[j].onclick=function(){buy(parseInt(this.getAttribute("data-buy"),10));};}document.getElementById("back").onclick=home;}
function buy(i){var s=SKINS[i];if(data.owned.indexOf(i)>=0)data.selected=i;else if(data.coins>=s[1]){data.coins-=s[1];data.owned.push(i);data.selected=i;}else{toast("Pas assez de pièces");return;}save();shop();}
function missions(){var h=top()+'<div class="screen"><div class="title">MISSIONS DU JOUR</div><div class="sub">'+new Date().toLocaleDateString("fr-FR")+'</div>';for(var i=0;i<MS.length;i++){var m=MS[i],v=Math.min(data.missions[m.id]||0,m.goal),ready=v>=m.goal,cl=!!data.claimed[m.id];h+='<div class="mission"><div class="name">'+m.title+'</div><div class="sub">'+m.desc+'</div><div class="missionbar"><div class="fill" style="width:'+(v/m.goal*100)+'%"></div></div><div class="price">'+v+'/'+m.goal+' • 🪙 '+m.reward+'</div><button class="claim '+(ready&&!cl?'ready':'')+'" data-claim="'+m.id+'">'+(cl?'RÉCOMPENSE PRISE':ready?'RÉCUPÉRER':'EN COURS')+'</button></div>';}h+='<div class="back" id="back">← RETOUR</div></div>';app.innerHTML=h;var bs=document.querySelectorAll("[data-claim]");for(var j=0;j<bs.length;j++){bs[j].onclick=function(){claim(this.getAttribute("data-claim"));};}document.getElementById("back").onclick=home;}
function claim(id){for(var i=0;i<MS.length;i++){if(MS[i].id===id){var m=MS[i];if((data.missions[id]||0)>=m.goal&&!data.claimed[id]){data.coins+=m.reward;data.claimed[id]=true;save();missions();}break;}}}
function rank(){var a=[["Toi",data.best],["NovaPilot",312],["PixelKing",248],["RaccoonX",205],["SkyMaster",181]],h=top()+'<div class="screen"><div class="title">CLASSEMENT</div><div class="sub">Démo locale.</div>';for(var i=0;i<a.length;i++)h+='<div class="rank"><b>#'+(i+1)+'</b><span style="margin-left:18px">'+a[i][0]+'</span><b>'+a[i][1]+'</b></div>';h+='<div class="back" id="back">← RETOUR</div></div>';app.innerHTML=h;document.getElementById("back").onclick=home;}
function premium(){app.innerHTML=top()+'<div class="screen"><div class="title">FLYCOON PREMIUM</div><div class="premium"><div class="name">🎬 Bonus test</div><div class="sub">+100 pièces dans cette version.</div><button id="bonus">RÉCUPÉRER +100</button></div><div class="premium"><div class="name">💎 Pack 1 000 pièces</div><div class="sub">Achat intégré à connecter.</div><button id="iap">ACHETER</button></div><div class="back" id="back">← RETOUR</div></div>';document.getElementById("bonus").onclick=function(){data.coins+=100;save();premium();};document.getElementById("iap").onclick=function(){toast("Paiement réel non activé");};document.getElementById("back").onclick=home;}
function toast(t){var n=document.createElement("div");n.className="toast";n.textContent=t;app.appendChild(n);setTimeout(function(){if(n.parentNode)n.parentNode.removeChild(n);},1300);}
var AC=null;function tone(f,d,v){if(!data.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.value=v;o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}}
var c,ctx,W,H,DPR,p,pipes,coins,parts,score,rc,last,spawn,playing,started,paused,raf;
function startGame(){app.innerHTML='<div class="game"><canvas id="c"></canvas><div class="hud"><div class="score" id="sc">0</div><b id="rc">🪙 0</b></div><button class="pause" id="pause">Ⅱ</button></div>';c=document.getElementById("c");ctx=c.getContext("2d");resize();p={x:Math.max(82,W*.23),y:H*.44,vy:0,r:18};pipes=[];coins=[];parts=[];score=0;rc=0;spawn=0;playing=true;started=false;paused=false;last=performance.now();c.addEventListener("touchstart",function(e){e.preventDefault();flap();},{passive:false});c.addEventListener("mousedown",function(e){e.preventDefault();flap();});document.getElementById("pause").onclick=function(e){e.stopPropagation();paused=!paused;this.textContent=paused?"▶":"Ⅱ";last=performance.now();};draw();raf=requestAnimationFrame(loop);setTimeout(function(){started=true;},650);}
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+"px";c.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0);}
function flap(){if(!playing||paused)return;started=true;p.vy=-365;tone(470,.06,.03);}
function addPipe(){var gap=Math.max(160,H*.19),range=Math.max(20,H-76-gap-195),top=90+Math.random()*range;pipes.push({x:W+40,w:68,top:top,gap:gap,passed:false});if(Math.random()>.12)coins.push({x:W+120,y:top+gap/2+(Math.random()*34-17),r:13,a:0});}
function loop(t){if(!playing)return;var dt=Math.min((t-last)/1000,.028);last=t;if(!paused)update(dt,t/1000);draw();raf=requestAnimationFrame(loop);}
function update(dt,time){if(started){p.vy+=930*dt;p.y+=p.vy*dt;}else p.y=H*.44+Math.sin(time*3)*4;spawn+=dt;if(spawn>1.48){spawn=0;addPipe();}var speed=188+Math.min(score*2.8,82),i,q;for(i=0;i<pipes.length;i++){q=pipes[i];q.x-=speed*dt;if(!q.passed&&q.x+q.w<p.x){q.passed=true;score++;document.getElementById("sc").textContent=score;tone(620,.04,.02);}}for(i=0;i<coins.length;i++){coins[i].x-=speed*dt;coins[i].a+=dt*6;}for(i=coins.length-1;i>=0;i--){q=coins[i];var dx=q.x-p.x,dy=q.y-p.y;if(dx*dx+dy*dy<(q.r+p.r)*(q.r+p.r)){coins.splice(i,1);rc++;document.getElementById("rc").textContent="🪙 "+rc;tone(980,.09,.05);burst(p.x,p.y);}}for(i=0;i<parts.length;i++){parts[i].x+=parts[i].vx*dt;parts[i].y+=parts[i].vy*dt;parts[i].life-=dt;}parts=parts.filter(function(x){return x.life>0;});pipes=pipes.filter(function(x){return x.x+x.w>-40;});coins=coins.filter(function(x){return x.x>-40;});if(started&&hit())finish();}
function hit(){if(p.y-p.r<0||p.y+p.r>H-76)return true;for(var i=0;i<pipes.length;i++){var q=pipes[i];if(p.x+p.r>q.x&&p.x-p.r<q.x+q.w&&(p.y-p.r<q.top||p.y+p.r>q.top+q.gap))return true;}return false;}
function burst(x,y){for(var i=0;i<12;i++){var a=Math.random()*6.28,s=50+Math.random()*100;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5});}}
function draw(){var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#4bc3df");g.addColorStop(1,"#c7f3f6");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle="#7fc66d";ctx.beginPath();ctx.moveTo(0,H-135);for(var x=0;x<=W+80;x+=80)ctx.quadraticCurveTo(x+40,H-190,x+80,H-135);ctx.lineTo(W,H-76);ctx.lineTo(0,H-76);ctx.fill();for(var i=0;i<pipes.length;i++)drawPipe(pipes[i]);for(i=0;i<coins.length;i++)drawCoin(coins[i]);for(i=0;i<parts.length;i++){ctx.fillStyle="#fff6a8";ctx.beginPath();ctx.arc(parts[i].x,parts[i].y,3,0,6.3);ctx.fill();}drawPlayer();ctx.fillStyle="#d4b15d";ctx.fillRect(0,H-76,W,76);ctx.fillStyle="#6dba49";ctx.fillRect(0,H-84,W,10);}
function drawPipe(q){ctx.fillStyle="#40b73c";ctx.strokeStyle="#247928";ctx.lineWidth=3;ctx.fillRect(q.x,0,q.w,q.top);ctx.strokeRect(q.x,0,q.w,q.top);var y=q.top+q.gap;ctx.fillRect(q.x,y,q.w,H-y-76);ctx.strokeRect(q.x,y,q.w,H-y-76);}
function drawCoin(q){ctx.save();ctx.translate(q.x,q.y);ctx.scale(.75+Math.abs(Math.cos(q.a))*.35,1);ctx.fillStyle="#ffd33d";ctx.strokeStyle="#e39b16";ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,q.r,0,6.3);ctx.fill();ctx.stroke();ctx.restore();}
function drawPlayer(){var s=SKINS[data.selected]||SKINS[0];ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.max(-.4,Math.min(1,p.vy/500)));ctx.fillStyle="#657384";ctx.fillRect(-28,-7,11,21);ctx.fillStyle="#ff8d00";ctx.beginPath();ctx.moveTo(-28,14);ctx.lineTo(-22,30);ctx.lineTo(-16,14);ctx.fill();ctx.fillStyle=s[2];ctx.beginPath();ctx.arc(0,0,p.r,0,6.3);ctx.fill();ctx.fillStyle="#eee";ctx.beginPath();ctx.ellipse(0,2,15,10,0,0,6.3);ctx.fill();ctx.fillStyle="#111722";ctx.beginPath();ctx.arc(-6,0,3,0,6.3);ctx.arc(6,0,3,0,6.3);ctx.arc(0,8,3,0,6.3);ctx.fill();ctx.restore();}
function finish(){if(!playing)return;playing=false;cancelAnimationFrame(raf);tone(130,.2,.06);data.coins+=rc;data.best=Math.max(data.best,score);data.games++;data.missions.score=Math.max(data.missions.score||0,score);data.missions.coins=(data.missions.coins||0)+rc;data.missions.games=(data.missions.games||0)+1;var xp=Math.max(8,score*4+rc*2);data.xp+=xp;while(data.xp>=xpT(data.level)&&data.level<50){data.xp-=xpT(data.level);data.level++;}save();app.innerHTML+='<div class="overlay"><div class="modal"><div class="big">VOL TERMINÉ</div><div class="stats"><div><b>'+score+'</b><span>SCORE</span></div><div><b>🪙 '+rc+'</b><span>PIÈCES</span></div><div><b>+'+xp+'</b><span>XP</span></div></div><button class="primary" id="replay">REJOUER</button><button class="secondary" id="menu">MENU</button></div></div>';document.getElementById("replay").onclick=startGame;document.getElementById("menu").onclick=home;}
window.onerror=function(msg){app.innerHTML='<div id="boot"><div><b>FLYCOON V5.1</b><p>Erreur de chargement Safari corrigible.</p><p style="font-size:12px">'+String(msg)+'</p></div></div>';};
setTimeout(home,100);
})();
</script>
</body>
</html>
