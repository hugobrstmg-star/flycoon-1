<script>
(function(){
"use strict";

var app=document.getElementById("app");
var errorBox=document.getElementById("errorBox");
window.onerror=function(msg,url,line){
  errorBox.style.display="block";
  errorBox.innerHTML="Erreur Safari : "+String(msg)+" (ligne "+String(line||"?")+")";
};

function clone(obj){return JSON.parse(JSON.stringify(obj));}
function today(){return new Date().toISOString().slice(0,10);}
var SKINS=[
["Classique",0,"#756457","AUTHENTIQUE"],
["Explorateur",450,"#8a6848","AVENTURIER"],
["Pilote Pro",900,"#4d555c","PRO"],
["Urbain",1400,"#353b42","STREET"],
["Sauvage",2100,"#66594b","RUSTIQUE"],
["Élite",3200,"#34312d","PRESTIGE"]
];
var MISSIONS=[
{id:"score",title:"As du ciel",desc:"Atteins 20 points",goal:20,reward:250},
{id:"coins",title:"Ruée vers l'or",desc:"Ramasse 20 pièces",goal:20,reward:300},
{id:"games",title:"Toujours plus haut",desc:"Termine 5 parties",goal:5,reward:200}
];
var DEFAULT={coins:0,best:0,level:1,xp:0,owned:[0],selected:0,games:0,dailyDate:today(),missions:{score:0,coins:0,games:0},claimed:{},sound:true};
var data=clone(DEFAULT);

try{
  var raw=localStorage.getItem("flycoonV52");
  if(raw){
    var parsed=JSON.parse(raw);
    var key;
    for(key in parsed){if(parsed.hasOwnProperty(key)){data[key]=parsed[key];}}
  }
}catch(e){}

if(!data.owned||!data.owned.length){data.owned=[0];}
if(typeof data.selected!=="number"||!SKINS[data.selected]){data.selected=0;}
if(!data.missions){data.missions={score:0,coins:0,games:0};}
if(!data.claimed){data.claimed={};}
if(data.dailyDate!==today()){data.dailyDate=today();data.missions={score:0,coins:0,games:0};data.claimed={};}

function save(){try{localStorage.setItem("flycoonV52",JSON.stringify(data));}catch(e){}}
function xpTarget(level){return 120+(level-1)*45;}
function header(){return '<div class="top"><div class="logo">FLYCOON</div><div class="wallet">🪙 '+data.coins+'</div></div>';}
function makeRaccoon(color){return '<div class="hero"><div class="glow"></div><div class="raccoon" style="background:'+color+'"><i class="ear l"></i><i class="ear r"></i><div class="face"></div><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><div class="jet"></div><div class="flame"></div></div></div>';}

function home(){
  var sk=SKINS[data.selected]||SKINS[0];
  app.innerHTML=
    '<div class="simpleHome">'+
      '<div class="simpleTop"><div class="simpleBrand">FLY<b>COON</b></div><div class="simpleCoins">🪙 '+data.coins+'</div></div>'+
      '<div class="simpleHero"><canvas id="menuHero"></canvas><div class="heroInfo"><div><h1>Prêt à voler ?</h1><p>Évite les obstacles, collecte les pièces et découvre de nouveaux mondes.</p></div><div class="heroSkinTag">'+sk[0]+'</div></div></div>'+
      '<button class="playMain" id="mainPlay">▶ JOUER</button>'+
      '<div class="menuStats"><div class="menuStat"><small>NIVEAU</small><b>'+data.level+'</b></div><div class="menuStat"><small>MEILLEUR SCORE</small><b>🏆 '+data.best+'</b></div></div>'+
      '<div class="menuNav">'+
        '<button id="mainCharacters">🦝 PERSONNAGES</button>'+
        '<button id="mainMissions">🎯 MISSIONS</button>'+
        '<button id="mainRank">🏆 CLASSEMENT</button>'+
        '<button id="mainSound">'+(data.sound?'🔊 SON ACTIVÉ':'🔇 SON COUPÉ')+'</button>'+
        '<button class="wide" id="mainPremium">💎 RÉCOMPENSES & PREMIUM</button>'+
      '</div>'+
    '</div>';
  document.getElementById("mainPlay").onclick=startGame;
  document.getElementById("mainCharacters").onclick=shop;
  document.getElementById("mainMissions").onclick=missions;
  document.getElementById("mainRank").onclick=ranking;
  document.getElementById("mainPremium").onclick=premium;
  document.getElementById("mainSound").onclick=function(){data.sound=!data.sound;save();home();};
  drawMenuHero();
}
function drawMenuHero(){
  var c=document.getElementById("menuHero");if(!c)return;
  var r=c.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1),w=r.width,h=r.height;
  c.width=Math.max(1,Math.round(w*d));c.height=Math.max(1,Math.round(h*d));
  var g=c.getContext("2d");g.setTransform(d,0,0,d,0,0);
  var skin=SKINS[data.selected]||SKINS[0],fur=skin[2]||"#756457",idx=data.selected||0;

  // cinematic mountain forest

var audioContext=null;
function tone(freq,dur,vol){
  if(!data.sound){return;}
  try{
    if(!audioContext){audioContext=new (window.AudioContext||window.webkitAudioContext)();}
    var osc=audioContext.createOscillator();
    var gain=audioContext.createGain();
    osc.frequency.value=freq;
    gain.gain.value=vol;
    osc.connect(gain);gain.connect(audioContext.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001,audioContext.currentTime+dur);
    osc.stop(audioContext.currentTime+dur);
  }catch(e){}
}

var canvas,ctx,W,H,DPR,player,pipes,gameCoins,particles,score,runCoins,last,spawn,playing,started,paused,raf;

function startGame(){
  continueUsed=false;invincibleUntil=0;
  app.innerHTML='<div class="game"><canvas id="gameCanvas"></canvas><div class="worldBadge" id="worldBadge">🌤 Prairie</div><div class="hud"><div class="score" id="scoreText">0</div><b id="coinText">🪙 0</b></div><button class="pause" id="pauseBtn">Ⅱ</button><div class="worldFlash" id="worldFlash"></div></div>';
  canvas=document.getElementById("gameCanvas");
  ctx=canvas.getContext("2d");
  resizeCanvas();
  player={x:Math.max(82,W*0.23),y:H*0.44,vy:0,r:18};currentWorldIndex=0;
  pipes=[];gameCoins=[];particles=[];score=0;runCoins=0;spawn=0;playing=true;started=false;paused=false;last=new Date().getTime();
  canvas.ontouchstart=function(e){if(e&&e.preventDefault){e.preventDefault();}flap();return false;};
  canvas.onmousedown=function(e){if(e&&e.preventDefault){e.preventDefault();}flap();return false;};
  document.getElementById("pauseBtn").onclick=function(e){if(e&&e.stopPropagation){e.stopPropagation();}paused=!paused;this.innerHTML=paused?"▶":"Ⅱ";last=new Date().getTime();};
  updateWorldUI(true);
  draw();
  raf=requestAnimationFrame(loop);
}

function resizeCanvas(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

function flap(){
  if(!playing||paused){return;}
  started=true;player.vy=-365;tone(470,0.06,0.03);
}

function addPipe(){
  var wi=getWorldIndex(score),wld=WORLDS[wi];
  var baseGap=Math.max(165,H*0.19);
  var gap=Math.max(138,baseGap-Math.min(score*.22,28));
  var range=Math.max(20,H-76-gap-195);
  var top=90+Math.random()*range;
  var width=68,variant="normal";

  if(score>=12&&Math.random()<.20){width=88;variant="wide";}
  if(score>=30&&Math.random()<.18){gap=Math.max(140,gap-12);variant="tight";}
  if(score>=55&&Math.random()<.15){width=56;variant="slim";}

  pipes.push({
    x:W+40,w:width,top:top,gap:gap,passed:false,
    world:wi,type:wld.type,variant:variant,
    wobble:(score>=35&&Math.random()<.20)?(Math.random()*.8+.3):0,
    baseTop:top,phase:Math.random()*6.28
  });

  if(Math.random()>0.10){
    var coinY=top+gap/2+(Math.random()*34-17);
    gameCoins.push({x:W+125,y:coinY,r:13,a:0});
    if(score>=40&&Math.random()<.20){
      gameCoins.push({x:W+158,y:coinY-24,r:11,a:1.2});
      gameCoins.push({x:W+190,y:coinY+18,r:11,a:2.1});
    }
  }
}

function loop(){
  if(!playing){return;}
  var now=new Date().getTime();
  var dt=Math.min((now-last)/1000,0.028);
  last=now;
  if(!paused){update(dt,now/1000);}
  updateWorldUI(true);
  draw();
  raf=requestAnimationFrame(loop);
}

function update(dt,time){
  var i,q,dx,dy,speed;
  if(started){player.vy+=930*dt;player.y+=player.vy*dt;}
  else{player.y=H*0.44+Math.sin(time*3)*4;}
  spawn+=dt;
  if(spawn>1.48){spawn=0;addPipe();}
  speed=188+Math.min(score*2.8,82);
  for(i=0;i<pipes.length;i++){
    q=pipes[i];q.x-=speed*dt;
    if(q.wobble){
      q.phase+=dt*q.wobble;
      q.top=q.baseTop+Math.sin(q.phase)*Math.min(24,10+score*.08);
    }
    if(!q.passed&&q.x+q.w<player.x){q.passed=true;score++;document.getElementById("scoreText").innerHTML=score;tone(620,0.04,0.02);updateWorldUI(false);}
  }
  for(i=0;i<gameCoins.length;i++){gameCoins[i].x-=speed*dt;gameCoins[i].a+=dt*6;}
  for(i=gameCoins.length-1;i>=0;i--){
    q=gameCoins[i];dx=q.x-player.x;dy=q.y-player.y;
    if(dx*dx+dy*dy<(q.r+player.r)*(q.r+player.r)){
      gameCoins.splice(i,1);runCoins++;document.getElementById("coinText").innerHTML="🪙 "+runCoins;tone(980,0.09,0.05);burst(player.x,player.y);
    }
  }
  for(i=0;i<particles.length;i++){particles[i].x+=particles[i].vx*dt;particles[i].y+=particles[i].vy*dt;particles[i].life-=dt;}
  particles=particles.filter(function(x){return x.life>0;});
  pipes=pipes.filter(function(x){return x.x+x.w>-40;});
  gameCoins=gameCoins.filter(function(x){return x.x>-40;});
  if(started&&collision()){finishGame();}
}

function collision(){
  if(new Date().getTime()<invincibleUntil){return false;}
  if(player.y-player.r<0||player.y+player.r>H-76){return true;}
  var i,q;
  for(i=0;i<pipes.length;i++){
    q=pipes[i];
    if(player.x+player.r>q.x&&player.x-player.r<q.x+q.w&&(player.y-player.r<q.top||player.y+player.r>q.top+q.gap)){return true;}
  }
  return false;
}

function burst(x,y){
  var i,a,s;
  for(i=0;i<12;i++){a=Math.random()*6.28;s=50+Math.random()*100;particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.5});}
}

  var wi=getWorldIndex(score);if(wi<0||wi>=WORLDS.length){wi=0;}
  var world=WORLDS[wi],i,now=(new Date().getTime()/1000),ground=H-76;
  ctx.save();ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;

  // Base sky
  ctx.fillStyle=world.sky1||"#62c5f4";ctx.fillRect(0,0,W,H);
  ctx.fillStyle=world.sky2||"#dff5ff";ctx.globalAlpha=.38;ctx.fillRect(0,H*.42,W,H*.58);ctx.globalAlpha=1;

  // Progressive biome scenery, moving in parallax.
  drawBiomeBackground(wi,now,ground);

  for(i=0;i<pipes.length;i++){drawPipeSafe(pipes[i]);}
  for(i=0;i<gameCoins.length;i++){drawCoinSafe(gameCoins[i]);}

  // Foreground terrain.
  ctx.fillStyle=world.ground1||"#62a94d";ctx.fillRect(0,ground,W,76);

  ctx.fillStyle=world.ground2||"#477f3e";ctx.fillRect(0,ground+27,W,49);
  ctx.restore();
}

function drawBiomeBackground(wi,t,g){

    off=(t*18)%180;for(i=-1;i<W/180+2;i++){x=i*180-off;drawCactusBG(x,g-10,.85);}

  }else if(wi===2){

    ctx.fillStyle="#091632";ctx.fillRect(0,0,W,g);
    ctx.fillStyle="#eef3ff";ctx.beginPath();ctx.arc(W*.78,H*.15,28,0,6.283);ctx.fill();
    ctx.fillStyle="#fff";for(i=0;i<28;i++)ctx.fillRect((i*73)%W,28+(i*47)%Math.max(90,g*.55),2,2);
    off=(t*10)%80;for(i=-2;i<W/80+2;i++){x=i*80-off;drawPineBG(x,g,.75,"#183a43");}

    // Volcanic valley: mountains, smoke, lava glow.
    ctx.fillStyle="#2a1821";ctx.fillRect(0,0,W,g);
    ctx.fillStyle="#5a3030";ctx.beginPath();ctx.moveTo(0,g-90);ctx.lineTo(W*.23,g-245);ctx.lineTo(W*.42,g-105);
    ctx.lineTo(W*.68,g-285);ctx.lineTo(W,g-100);ctx.lineTo(W,g);ctx.lineTo(0,g);ctx.fill();
    ctx.fillStyle="#ff5b24";ctx.beginPath();ctx.moveTo(W*.61,g-205);ctx.lineTo(W*.68,g-285);ctx.lineTo(W*.73,g-205);ctx.fill();
    off=(t*16)%145;for(i=-1;i<W/145+2;i++){x=i*145-off;drawRockBG(x,g-3);}
  }else{
    // Cosmos: stars, planets, futuristic skyline.
    ctx.fillStyle="#080b2c";ctx.fillRect(0,0,W,g);
    ctx.fillStyle="#fff";for(i=0;i<38;i++)ctx.fillRect((i*59)%W,24+(i*83)%Math.max(100,g*.7),1+(i%2),1+(i%2));
    ctx.fillStyle="#806ee8";ctx.beginPath();ctx.arc(W*.77,H*.18,37,0,6.283);ctx.fill();
    ctx.strokeStyle="#b8aaff";ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(W*.77,H*.18,56,12,-.2,0,6.283);ctx.stroke();
    off=(t*20)%100;for(i=-2;i<W/100+2;i++){x=i*100-off;drawCityBG(x,g);}
  }
}

function drawTreeBG(x,g,s){
  ctx.save();ctx.translate(x,g);ctx.scale(s,s);
  ctx.fillStyle="#654329";ctx.fillRect(-7,-78,14,78);
  ctx.fillStyle="#347f45";ctx.beginPath();ctx.arc(0,-88,31,0,6.283);ctx.arc(-21,-70,24,0,6.283);ctx.arc(23,-68,25,0,6.283);ctx.fill();
  ctx.fillStyle="#55a85c";ctx.beginPath();ctx.arc(-8,-96,17,0,6.283);ctx.fill();ctx.restore();
}
function drawBushBG(x,g,s){ctx.save();ctx.translate(x,g);ctx.scale(s,s);ctx.fillStyle="#2f8444";ctx.beginPath();ctx.arc(0,-15,20,0,6.283);ctx.arc(20,-13,16,0,6.283);ctx.arc(-18,-11,15,0,6.283);ctx.fill();ctx.restore();}
function drawCactusBG(x,g,s){ctx.save();ctx.translate(x,g);ctx.scale(s,s);ctx.fillStyle="#43865b";ctx.fillRect(-7,-65,14,65);ctx.fillRect(-22,-45,17,9);ctx.fillRect(-22,-45,8,25);ctx.fillRect(5,-35,20,9);ctx.fillRect(17,-52,8,25);ctx.restore();}
function drawPineBG(x,g,s,c){ctx.save();ctx.translate(x,g);ctx.scale(s,s);ctx.fillStyle="#3d3028";ctx.fillRect(-5,-68,10,68);ctx.fillStyle=c;for(var k=0;k<3;k++){ctx.beginPath();ctx.moveTo(0,-125+k*30);ctx.lineTo(-35+k*3,-55+k*20);ctx.lineTo(35-k*3,-55+k*20);ctx.fill();}ctx.restore();}
function drawRockBG(x,g){ctx.fillStyle="#493334";ctx.beginPath();ctx.moveTo(x-28,g);ctx.lineTo(x-16,g-32);ctx.lineTo(x+8,g-45);ctx.lineTo(x+30,g);ctx.fill();}
function drawCityBG(x,g){ctx.fillStyle="#252c68";ctx.fillRect(x-25,g-65,50,65);ctx.fillStyle="#6978e8";ctx.fillRect(x-17,g-54,7,10);ctx.fillRect(x+6,g-43,7,10);ctx.fillRect(x-17,g-25,7,10);ctx.fillRect(x+6,g-18,7,10);}

function drawCloudSafe(x,y,s){
  ctx.save();ctx.globalAlpha=.7;ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.arc(x,y,18*s,0,6.283);ctx.arc(x+23*s,y-8*s,25*s,0,6.283);
  ctx.arc(x+50*s,y,18*s,0,6.283);ctx.fill();
  ctx.fillRect(x,y,50*s,18*s);ctx.restore();
}

function drawPipeSafe(q){
  var wi=(typeof q.world==="number")?q.world:getWorldIndex(score);if(wi<0||wi>4)wi=0;
  var bottom=q.top+q.gap;
  if(wi===0||q.type==="trunk"){drawTreeObstacle(q,bottom);return;}
  if(wi===1||q.type==="rock"){drawRockObstacle(q,bottom);return;}
  if(wi===2||q.type==="crystal"){drawCrystalObstacle(q,bottom);return;}
  if(wi===3||q.type==="lava"){drawLavaObstacle(q,bottom);return;}
  drawTechObstacle(q,bottom);
}
function drawTreeObstacle(q,b){
  // Actual tree trunks with bark, cut branches and foliage instead of recolored pipes.
  ctx.fillStyle="#4b2e1c";ctx.fillRect(q.x-3,0,q.w+6,q.top);ctx.fillRect(q.x-3,b,q.w+6,Math.max(0,H-76-b));
  ctx.fillStyle="#7b4b2a";ctx.fillRect(q.x+4,0,q.w-8,q.top);ctx.fillRect(q.x+4,b,q.w-8,Math.max(0,H-76-b));
  ctx.strokeStyle="#a06a3c";ctx.lineWidth=3;
  for(var y=18;y<q.top;y+=32){ctx.beginPath();ctx.moveTo(q.x+9,y);ctx.lineTo(q.x+q.w-9,y+9);ctx.stroke();}
  for(var y2=b+20;y2<H-76;y2+=35){ctx.beginPath();ctx.moveTo(q.x+8,y2);ctx.lineTo(q.x+q.w-10,y2+8);ctx.stroke();}
  ctx.fillStyle="#286c3c";
  ctx.beginPath();ctx.arc(q.x+q.w/2,q.top-4,q.w*.62,0,6.283);ctx.fill();
  ctx.beginPath();ctx.arc(q.x+q.w/2,b+7,q.w*.62,0,6.283);ctx.fill();
  ctx.fillStyle="#4c9b54";ctx.beginPath();ctx.arc(q.x+q.w*.32,q.top-10,q.w*.28,0,6.283);ctx.arc(q.x+q.w*.7,b+3,q.w*.27,0,6.283);ctx.fill();
}
function drawRockObstacle(q,b){
  ctx.fillStyle="#8d5738";
  poly([[q.x,0],[q.x+q.w,0],[q.x+q.w-5,q.top-18],[q.x+q.w*.72,q.top],[q.x+8,q.top-7]]);
  poly([[q.x,b+13],[q.x+12,b],[q.x+q.w*.72,b+5],[q.x+q.w,b+25],[q.x+q.w,H-76],[q.x,H-76]]);
  ctx.fillStyle="#c98550";ctx.beginPath();ctx.moveTo(q.x+8,q.top-30);ctx.lineTo(q.x+q.w*.5,q.top-12);ctx.lineTo(q.x+q.w-8,q.top-27);ctx.fill();
}
function drawCrystalObstacle(q,b){
  ctx.fillStyle="#473d91";ctx.fillRect(q.x+8,0,q.w-16,Math.max(0,q.top-18));ctx.fillRect(q.x+8,b+18,q.w-16,Math.max(0,H-94-b));
  ctx.fillStyle="#8175ef";
  crystal(q.x+q.w/2,q.top, q.w*.46,-1);crystal(q.x+q.w/2,b,q.w*.46,1);
  ctx.fillStyle="#b8b0ff";crystal(q.x+q.w*.34,q.top-4,q.w*.18,-1);crystal(q.x+q.w*.68,b+4,q.w*.18,1);
}
function drawLavaObstacle(q,b){
  ctx.fillStyle="#342529";ctx.fillRect(q.x,0,q.w,q.top);ctx.fillRect(q.x,b,q.w,Math.max(0,H-76-b));
  ctx.fillStyle="#6d3c31";for(var y=18;y<q.top;y+=30)ctx.fillRect(q.x+7,y,q.w-14,7);
  ctx.fillStyle="#ff5b1f";ctx.fillRect(q.x-4,q.top-9,q.w+8,9);ctx.fillRect(q.x-4,b,q.w+8,9);
  ctx.fillStyle="#ffbd32";ctx.fillRect(q.x+7,q.top-5,q.w*.28,5);ctx.fillRect(q.x+q.w*.55,b,q.w*.3,5);
}
function drawTechObstacle(q,b){
  ctx.fillStyle="#252d69";ctx.fillRect(q.x,0,q.w,q.top);ctx.fillRect(q.x,b,q.w,Math.max(0,H-76-b));
  ctx.strokeStyle="#78d7ff";ctx.lineWidth=3;ctx.strokeRect(q.x+4,4,q.w-8,Math.max(0,q.top-8));ctx.strokeRect(q.x+4,b+4,q.w-8,Math.max(0,H-84-b));
  ctx.fillStyle="#91f2ff";for(var y=18;y<q.top;y+=34)ctx.fillRect(q.x+q.w*.38,y,q.w*.24,5);
  for(var y2=b+18;y2<H-76;y2+=34)ctx.fillRect(q.x+q.w*.38,y2,q.w*.24,5);
}
function poly(points){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(var i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fill();}
function crystal(x,y,r,dir){ctx.beginPath();ctx.moveTo(x-r,y);ctx.lineTo(x,y+dir*r*1.45);ctx.lineTo(x+r,y);ctx.lineTo(x+r*.45,y-dir*r*.7);ctx.lineTo(x-r*.45,y-dir*r*.7);ctx.closePath();ctx.fill();}

function drawCoinSafe(c){
  ctx.save();ctx.translate(c.x,c.y);
  ctx.fillStyle="#f6b91f";ctx.beginPath();ctx.arc(0,0,c.r,0,6.283);ctx.fill();
  ctx.fillStyle="#ffe889";ctx.beginPath();ctx.arc(-3,-4,c.r*.35,0,6.283);ctx.fill();
  ctx.fillStyle="#b77b0a";ctx.font="bold "+Math.max(10,c.r)+"px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("F",0,1);
  ctx.restore();
}

function drawPlayerSafe(){
  if(!player)return;
  var skin=SKINS[data.selected]||SKINS[0],fur=skin[2]||"#756457",idx=data.selected||0;
  ctx.save();ctx.translate(player.x,player.y);ctx.rotate(Math.max(-.30,Math.min(.48,player.vy/760)));

  // exhaust behind the model
  var eg=ctx.createRadialGradient(-34,10,1,-34,10,28);eg.addColorStop(0,"rgba(255,244,170,.88)");eg.addColorStop(.35,"rgba(255,126,29,.5)");eg.addColorStop(1,"rgba(255,80,10,0)");
  ctx.fillStyle=eg;ctx.beginPath();ctx.ellipse(-36,11,27,13,0,0,6.283);ctx.fill();
  ctx.fillStyle="#ff9e27";ctx.beginPath();ctx.moveTo(-34,6);ctx.lineTo(-52,11);ctx.lineTo(-34,16);ctx.fill();

  drawRaccoonModel(ctx,fur,idx,false);
  ctx.restore();
}
var continueUsed=false, invincibleUntil=0;

function resumeAfterReward(){
  var ov=document.querySelector(".overlay");
  if(ov&&ov.parentNode)ov.parentNode.removeChild(ov);

  // Move the player to a guaranteed safe point and remove nearby hazards.
  player.y=H*.44;player.vy=0;
  pipes=pipes.filter(function(q){return q.x>player.x+W*.48;});
  gameCoins=gameCoins.filter(function(q){return q.x>player.x+60;});
  spawn=.55;
  playing=true;started=false;paused=false;
  invincibleUntil=new Date().getTime()+3200;
  last=new Date().getTime();

  var game=document.querySelector(".game");
  var counter=document.createElement("div");counter.className="resumeCount";counter.innerHTML="3";game.appendChild(counter);
  var shield=document.createElement("div");shield.className="shieldRing";shield.style.left=(player.x-37)+"px";shield.style.top=(player.y-37)+"px";game.appendChild(shield);

  var n=3;
  var ct=setInterval(function(){
    n--;
    if(n>0){counter.innerHTML=n;return;}
    clearInterval(ct);
    if(counter.parentNode)counter.parentNode.removeChild(counter);
    started=true;player.vy=-250;
    raf=requestAnimationFrame(loop);
    setTimeout(function(){if(shield.parentNode)shield.parentNode.removeChild(shield);},2300);
  },700);
}

function showRewardedAd(){
  var btn=document.getElementById("continueBtn"),n=3;
  if(!btn)return;
  btn.disabled=true;btn.innerHTML="PUBLICITÉ · "+n+" s";
  var timer=setInterval(function(){
    n--;
    if(n>0){btn.innerHTML="PUBLICITÉ · "+n+" s";return;}
    clearInterval(timer);
    continueUsed=true;
    resumeAfterReward();
  },1000);
}

function finishGame(){
  if(!playing)return;
  playing=false;cancelAnimationFrame(raf);tone(130,.2,.06);

  var gained=Math.max(8,score*4+runCoins*2);
  var continueHtml=continueUsed?"":'<button class="primary continueAd" id="continueBtn">▶ PUB RÉCOMPENSÉE · CONTINUER</button>';
  var markup='<div class="overlay"><div class="modal"><div class="big">PARTIE TERMINÉE</div>'+
    '<div class="stats"><div><b>'+score+'</b><span>SCORE</span></div><div><b>🪙 '+runCoins+'</b><span>PIÈCES</span></div><div><b>+'+gained+'</b><span>XP</span></div></div>'+
    continueHtml+
    '<button class="secondary" id="replayBtn">↻ REJOUER DEPUIS LE DÉBUT</button>'+
    '<button class="secondary" id="menuBtn">⌂ RETOUR AU MENU</button>'+
    '<div class="small" style="margin-top:10px">La continuation conserve ton score et tes pièces de cette partie.</div></div></div>';

  // insertAdjacentHTML preserves the existing canvas and its context.
  app.insertAdjacentHTML("beforeend",markup);

  function bankRun(next){
    data.coins+=runCoins;data.best=Math.max(data.best,score);data.games++;
    data.missions.score=Math.max(data.missions.score||0,score);
    data.missions.coins=(data.missions.coins||0)+runCoins;
    data.missions.games=(data.missions.games||0)+1;
    data.xp+=gained;
    while(data.level<50&&data.xp>=xpTarget(data.level)){data.xp-=xpTarget(data.level);data.level++;}
    save();continueUsed=false;invincibleUntil=0;next();
  }

  var c=document.getElementById("continueBtn");if(c)c.onclick=showRewardedAd;
  document.getElementById("replayBtn").onclick=function(){bankRun(startGame);};
  document.getElementById("menuBtn").onclick=function(){bankRun(home);};
}

/* Static menu is visible BEFORE JS. These bindings make even partial JS startup usable. */
document.getElementById("walletStatic").innerHTML="🪙 "+data.coins;
document.getElementById("staticLevel").innerHTML="NIVEAU "+data.level;
document.getElementById("staticXp").style.width=Math.min(100,(data.xp/xpTarget(data.level))*100)+"%";
document.getElementById("staticBest").innerHTML="🏆 RECORD : "+data.best;
document.getElementById("staticRaccoon").style.background=(SKINS[data.selected]||SKINS[0])[2];
document.getElementById("staticPlay").onclick=startGame;
document.getElementById("staticShop").onclick=shop;
document.getElementById("staticMissions").onclick=missions;
document.getElementById("staticRank").onclick=ranking;
document.getElementById("staticPremium").onclick=premium;
document.getElementById("staticSound").onclick=function(){data.sound=!data.sound;save();home();};

/* Replace static home only after everything above has parsed successfully. */
setTimeout(home,50);

})();

</script>
